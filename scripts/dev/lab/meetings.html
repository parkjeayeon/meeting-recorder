<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>회의 목록 실험</title>
<!-- 회의 목록 대안 세 가지를 가짜 회의로 비교하는 개발용 페이지 (앱에 들어가지 않는다). npm run lab:meetings -->
<link rel="stylesheet" href="../../../src/renderer/style.css" />
<style>
  /* ── 실험 막대 (앱에 없는 부분) ── */
  .lab-bar { display: flex; align-items: center; gap: 10px; flex: 1; -webkit-app-region: no-drag; }
  .seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--shell-on); }
  .seg button { white-space: nowrap; height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
  .seg button[aria-pressed='true'] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(16, 20, 26, 0.08); }
  .lab-note { font-size: 12px; color: var(--ink-3); }

  .page-head .search { width: 280px; }
  .count-line { margin: -14px 0 20px; font-size: 12.5px; color: var(--ink-3); }

  /* ── A. 장부: 월로 묶은 촘촘한 줄, 오른쪽 월 색인 ── */
  .ledger-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 28px; }
  .ledger-month { position: relative; }
  .ledger-mhead {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 10px;
    padding: 14px 0 8px; margin-bottom: 2px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .ledger-mhead h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.015em; }
  .ledger-mhead span { font-size: 12px; color: var(--ink-3); }
  .lrow {
    display: grid; grid-template-columns: 58px 46px minmax(0, 1fr) 76px 62px 44px 64px; align-items: center; gap: 12px;
    min-height: 44px; padding: 0 10px; margin: 0 -10px; border-radius: 9px; text-decoration: none; color: inherit;
  }
  .lrow:hover { background: var(--panel-2); }
  .lrow.daystart { border-top: 1px solid var(--line); border-radius: 0 0 9px 9px; }
  .ledger-month .lrow.daystart:first-of-type { border-top: 0; }
  .lday { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; font-size: 13px; font-weight: 650; color: var(--ink); }
  .lday small { font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
  .lday.weekend small { color: var(--accent); }
  .ltime { font-size: 12px; color: var(--ink-3); }
  .ltitle { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .ltitle b { font-weight: 620; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
  .ltitle span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ltitle.muted b { color: var(--ink-3); font-weight: 550; }
  .ldur { font-size: 12px; color: var(--ink-3); text-align: right; }
  .st { justify-self: start; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .st.open { background: var(--accent-wash); color: var(--accent); }
  .st.done { color: var(--ink-3); padding: 0; }
  .st.done svg { width: 13px; height: 13px; color: var(--ok); }
  .st.fail { background: var(--accent); color: var(--accent-ink); }
  .st.busy { background: var(--panel-3); color: var(--ink-2); }
  .st.busy::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .st.draft { background: var(--panel-3); color: var(--ink-2); }
  .st.quiet { color: var(--ink-3); padding: 0; font-weight: 500; }
  .index { position: sticky; top: 8px; align-self: start; display: flex; flex-direction: column; gap: 1px; padding-top: 14px; }
  .index h3 { margin: 0 0 6px 8px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
  .index button { display: flex; justify-content: space-between; align-items: center; height: 28px; padding: 0 8px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font-size: 12.5px; text-align: left; }
  .index button:hover { background: var(--panel-2); color: var(--ink); }
  .index { position: sticky; max-height: calc(100vh - 120px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .index::-webkit-scrollbar { display: none; }
  /* 줄 목록의 상태: 알약 대신 글자 + 작은 표시 (알약은 손볼 회의 카드에만) */
  .rs { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .rs i { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--line-2); }
  .rs svg { width: 13px; height: 13px; }
  .rs.open { color: var(--ink-2); font-weight: 550; } /* 손볼 회의 칸이 이미 알리므로 목록에서는 점만 주홍 */
  .rs.open i { background: var(--accent); }
  .rs.fail { color: var(--accent); font-weight: 600; }
  .rs.busy { color: var(--ink-2); }
  .rs.busy i { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .rs.done svg { color: var(--ok); }
  .rs.draft i { background: none; box-shadow: inset 0 0 0 1.5px var(--line-2); }
  .ltitle .why { color: var(--accent); opacity: .85; }
  /* 줄 끝 동작: 마우스를 올리거나 키보드로 들어오면 보인다 (실패·짧은 녹음 줄만) */
  .racts { display: flex; justify-content: flex-end; gap: 2px; opacity: 0; transition: opacity .15s ease-out; }
  .lrow:hover .racts, .crow:hover .racts, .racts:focus-within { opacity: 1; }
  .racts .icon-btn { width: 30px; height: 30px; }
  .racts .icon-btn:hover { color: var(--accent); background: var(--panel-3); }
  .all-clear { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); font-size: 13px; color: var(--ink-3); }
  .all-clear b { color: var(--ink); font-weight: 620; }
  .ok-mark { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); flex: none; }
  .ok-mark svg { width: 13px; height: 13px; stroke-width: 2; }
  .more-btn { margin-top: 12px; }
  .more-btn svg { width: 13px; height: 13px; margin: 0 -2px 0 2px; }
  /* ── 질문으로 찾기 (더미) ── */
  .chip.ask { display: inline-flex; align-items: center; gap: 6px; border-style: dashed; }
  .chip.ask svg { width: 13px; height: 13px; }
  .chip.ask .num { margin-left: 0; }
  .chip.ask[aria-pressed='true'] { border-style: solid; }
  .chip.ask .x { display: grid; place-items: center; width: 16px; height: 16px; margin: 0 -5px 0 0; border-radius: 50%; color: inherit; opacity: .55; }
  .chip.ask .x:hover { opacity: 1; background: var(--shell-on); }
  .chip.ask .x svg { width: 10px; height: 10px; stroke-width: 2; }
  .spin { width: 11px; height: 11px; border-radius: 50%; border: 1.6px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(1turn); } }
  /* 찾을 범위: 조건 칩 (칩 하나 = 조건 하나, 칩끼리 AND). 누르면 작은 팝오버 */
  .conds-bar { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .cchip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border: 1px dashed var(--line-2); border-radius: 999px; background: none; color: var(--ink-3); font-size: 12px; font-weight: 550; white-space: nowrap; transition: border-color .15s ease-out, color .15s ease-out; }
  .cchip:hover { border-color: var(--ink-3); color: var(--ink-2); }
  .cchip svg { width: 12px; height: 12px; }
  .cchip.set { border-style: solid; border-color: transparent; background: var(--ink); color: var(--panel); padding-right: 4px; }
  .cchip.set .x { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; opacity: .7; }
  .cchip.set .x:hover { opacity: 1; background: rgba(255, 255, 255, .16); }
  .cchip.set .x svg { width: 10px; height: 10px; stroke-width: 2; }
  .cchip[aria-expanded='true'] { border-color: var(--ink-3); color: var(--ink); }
  .cchip.set[aria-expanded='true'] { color: var(--panel); box-shadow: 0 0 0 3px var(--accent-wash-2); } /* 값이 있는 칩을 열어도 글자가 배경에 묻히지 않게 */
  .cpop { position: absolute; z-index: 50; bottom: calc(100% + 8px); left: 0; width: 288px; display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow-pop); animation: pop .16s cubic-bezier(.16, 1, .3, 1); }
  .cpop.down { bottom: auto; top: calc(100% + 8px); }
  .cpop h4 { margin: 0; font-size: 12.5px; font-weight: 650; color: var(--ink); }
  .cpop p { margin: -6px 0 0; font-size: 11.5px; color: var(--ink-3); }
  .cpop .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .cpop .opts button { height: 28px; padding: 0 11px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); color: var(--ink-2); font: 500 12.5px var(--sans); }
  .cpop .opts button.num { font-family: var(--mono); }
  .cpop .opts button:hover { border-color: var(--ink-3); color: var(--ink); }
  .cpop .opts button[aria-pressed='true'] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
  .cpop .field { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 8px; font-size: 12.5px; color: var(--ink-3); }
  .cpop .field:focus-within { border-color: var(--ink-3); box-shadow: 0 0 0 3px var(--accent-wash); }
  .cpop .field input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font: 500 13px var(--mono); color: var(--ink); color-scheme: inherit; }
  /* 날짜 칸은 위아래로: 나란히 두면 날짜 칸 기본 너비 때문에 팝오버 밖으로 넘친다 */
  .cpop .dates { display: flex; flex-direction: column; gap: 6px; }
  .cpop .dates .field { width: 100%; box-sizing: border-box; overflow: hidden; }
  .cpop .dates small { width: 26px; font-size: 11.5px; color: var(--ink-3); flex: none; }
  .cpop .dates input { width: 100%; }
  .scope-label { font-size: 12px; color: var(--ink-3); }
  .pop-row { display: flex; align-items: center; gap: 10px; }
  .pop-row > .scope-label { flex: none; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; }
  .examples button { height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); color: var(--ink-2); font-size: 12px; }
  .examples button:hover { border-color: var(--line-2); color: var(--ink); }
  /* 1. 검색창: 입력하는 동안은 제목·요약 바로 거르기, Enter는 질문으로 찾기 */
  .askbar { position: relative; flex: 1; max-width: 520px; }
  .askbar .search { display: block; width: 100%; }
  .askbar .search input { padding-right: 112px; }
  .askbar .enter-hint { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--ink-3); pointer-events: none; }
  .askpop { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow-pop); }
  .askpop b { font-size: 12.5px; font-weight: 650; }
  /* 2. 서랍 */
  .askdrawer { position: fixed; z-index: 30; top: 52px; right: 16px; bottom: 16px; width: 380px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow-pop); }
  .askdrawer header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line); font-weight: 650; }
  .askdrawer header span { flex: 1; }
  .asklog { flex: 1; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
  .bubble.me { align-self: flex-end; max-width: 85%; padding: 8px 12px; border-radius: 12px 12px 4px 12px; background: var(--ink); color: var(--panel); font-size: 13.5px; }
  .bubble.me small { display: block; opacity: .65; font-size: 11.5px; margin-top: 2px; }
  .bubble.ai { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .bubble.ai .conds { display: flex; flex-wrap: wrap; gap: 4px; }
  .askcompose { padding: 12px; border-top: 1px solid var(--line); }
  .composer { display: flex; flex-direction: column; gap: 8px; padding: 10px 10px 8px 12px; border: 1px solid var(--line-2); border-radius: 14px; background: var(--panel); transition: border-color .15s ease-out, box-shadow .15s ease-out; }
  .composer:focus-within { border-color: var(--ink-3); box-shadow: 0 0 0 3px var(--accent-wash); }
  .composer textarea { min-height: 22px; max-height: 120px; resize: none; padding: 0; border: 0; background: none; font: inherit; font-size: 13.5px; line-height: 1.5; color: var(--ink); outline: none; }
  .composer .bottom { display: flex; align-items: center; gap: 8px; }
  .composer .bottom .conds-bar { flex: 1; }
  .send { display: grid; place-items: center; width: 30px; height: 30px; flex: none; border: 0; border-radius: 50%; background: var(--ink); color: var(--panel); }
  .send:disabled { background: var(--panel-3); color: var(--ink-3); }
  .send svg { width: 15px; height: 15px; margin: 1px 1px 0 0; }
  /* 4. 오른쪽 아래 고정 둥근 버튼 + 버튼 위로 열리는 채팅 창 */
  .fab { position: fixed; z-index: 35; right: 24px; bottom: 24px; display: grid; place-items: center; width: 52px; height: 52px; border: 0; border-radius: 50%; background: var(--ink); color: var(--panel); box-shadow: var(--shadow-pop); transition: transform .2s cubic-bezier(.16, 1, .3, 1); }
  .fab:hover { transform: scale(1.06); }
  .fab svg { width: 20px; height: 20px; }
  .fab-ring { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; border-bottom-color: transparent; animation: spin 1.1s linear infinite; }
  .fab-badge { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 700 11px/20px var(--mono); box-shadow: 0 0 0 2px var(--panel); }
  .fab-toast { position: fixed; z-index: 34; right: 88px; bottom: 32px; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 6px 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink-2); font-size: 12.5px; box-shadow: var(--shadow-pop); animation: slide .28s cubic-bezier(.16, 1, .3, 1); }
  .fab-toast svg { width: 14px; height: 14px; color: var(--ok); }
  .fab-toast b { color: var(--ink); font-weight: 650; }
  .fab-toast .go { height: 26px; padding: 0 10px; border-radius: 999px; background: var(--ink); color: var(--panel); font-weight: 600; display: grid; place-items: center; }
  @keyframes slide { from { opacity: 0; transform: translateX(10px); } }
  .askdrawer.fabpanel { top: auto; bottom: 88px; right: 24px; height: min(600px, calc(100vh - 140px)); transform-origin: bottom right; }
  .askdrawer.fabpanel.opening { animation: pop .22s cubic-bezier(.16, 1, .3, 1); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } }
  @media (prefers-reduced-motion: reduce) { .fab-ring, .askdrawer.fabpanel { animation: none; } }
  /* 3. 팔레트 */
  .askpal-back { position: fixed; z-index: 40; inset: 0; background: var(--backdrop); display: grid; align-items: start; justify-items: center; padding-top: 14vh; }
  .askpal { width: min(640px, 92vw); display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow-pop); overflow: hidden; }
  .askpal .big { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .askpal .big input { flex: 1; border: 0; outline: none; background: none; font-size: 17px; color: var(--ink); }
  .askpal .sec { display: flex; flex-direction: column; gap: 8px; padding: 12px 18px; }
  .askpal .sec + .sec { border-top: 1px solid var(--line); }
  .askpal .foot { display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: var(--panel-2); font-size: 12px; color: var(--ink-3); }
  .askpal .foot span { flex: 1; }
  .askfloat { position: fixed; z-index: 25; right: 20px; bottom: 20px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--ink); color: var(--panel); font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow-pop); }
  /* 질문 탭 머리 */
  .askhead { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; margin-bottom: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-2); }
  .askhead .qline { display: flex; align-items: center; gap: 10px; }
  .askhead .qline b { flex: 1; font-size: 16px; font-weight: 700; letter-spacing: -0.015em; }
  .askhead .conds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-3); }
  .cond { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); font-size: 11.5px; font-weight: 550; }
  .steps { display: flex; gap: 18px; font-size: 12.5px; color: var(--ink-3); }
  .steps span { display: inline-flex; align-items: center; gap: 6px; }
  .steps .now { color: var(--ink); font-weight: 600; }
  .steps .ok svg { width: 13px; height: 13px; color: var(--ok); }
  .ltitle .reason { color: var(--ink-2); }
  .bulk { display: flex; align-items: center; gap: 10px; margin: -8px 0 18px; font-size: 13px; color: var(--ink-3); }
  .index button { position: relative; z-index: 1; transition: color .2s ease-out; }
  .index button[aria-current='true'] { color: var(--ink); font-weight: 650; }
  /* 지금 칸 표시: 버튼마다 바탕을 바꾸지 않고 한 장이 미끄러져 따라간다 */
  /* 표시 이동과 연도 펼침·접힘은 같은 시간·같은 감속 (함께 시작해 함께 끝난다) */
  .index .pill { position: absolute; left: 0; right: 0; top: 0; height: 28px; border-radius: 7px; background: var(--panel-3); transform: translateY(var(--y, 0)); transition: transform .36s cubic-bezier(.16, 1, .3, 1), opacity .2s; pointer-events: none; }
  .ghost, .ghost * { transition: none !important; animation: none !important; }
  /* 바로가기로 도착한 칸: 제목 줄이 잠깐 주홍 물로 밝아졌다가 빠진다 */
  .arrive { animation: arrive 1.1s cubic-bezier(.16, 1, .3, 1); }
  @keyframes arrive { 0% { background-color: var(--accent-wash-2); box-shadow: -10px 0 0 var(--accent-wash-2), 10px 0 0 var(--accent-wash-2); } 100% { background-color: var(--panel); box-shadow: -10px 0 0 transparent, 10px 0 0 transparent; } }
  .sec-h.arrive, .archive-h.arrive { border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { .index .pill, .ymonths { transition: none; } .arrive { animation: none; } }
  .index button .num { font-size: 11px; color: var(--ink-3); }
  .index .year { margin: 10px 0 4px 8px; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }

  /* ── B. 섞기: 손볼 회의 + 최근 2주 (C) 위에, 그 아래는 장부 (A). 오른쪽 바로가기가 전체를 잇는다 ── */
  .mix-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 28px; }
  .mix-sec { scroll-margin-top: 8px; }
  .mix-sec + .mix-sec { margin-top: 36px; }
  .archive-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; padding-top: 4px; }
  .archive-h h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.015em; }
  .archive-h span { font-size: 12px; color: var(--ink-3); }
  .ygroup .yhead { gap: 6px; justify-content: flex-start; color: var(--ink-3); font-size: 11.5px; font-weight: 600; height: 26px; margin-top: 6px; }
  .ygroup .yhead .num { margin-left: auto; }
  .ygroup .yhead svg { width: 12px; height: 12px; transition: transform .25s cubic-bezier(.16, 1, .3, 1); }
  .ygroup.open .yhead svg { transform: rotate(90deg); }
  .ygroup.fixed .yhead { pointer-events: none; }

// 스크롤 위치에 맞춰 바로가기의 지금 칸을 표시
// 바로가기: 지금 자리에서 목표까지 미끄러져 간다 (멀어도 0.65초 안). 움직임 줄이기면 바로 이동
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
let gliding = null;
let glidingNow = false;
function glide(id) {
  const view = $('view');
  const el = $(id);
  if (!el) return;
  const from = view.scrollTop;
  const to = Math.min(view.scrollHeight - view.clientHeight, from + el.getBoundingClientRect().top - view.getBoundingClientRect().top - 8);
  const head = el.querySelector('.ledger-mhead, .sec-h, .archive-h') ?? el;
  const land = () => {
    glidingNow = false;
    $('view').onscroll?.();
    head.classList.remove('arrive');
    void head.offsetWidth; // 같은 칸을 다시 눌러도 다시 밝아지게
    head.classList.add('arrive');
  };
  cancelAnimationFrame(gliding);
  const dist = Math.abs(to - from);
  if (reduce.matches || dist < 4) {
    view.scrollTop = to;
    return land();
  }
  const ms = Math.min(650, 260 + dist / 12);
  const t0 = performance.now();
  const ease = (t) => (t === 1 ? 1 : 1 - 2 ** (-10 * t)); // 지수 감속: 빨리 출발해 부드럽게 멈춘다
  const step = (now) => {
    const t = Math.min(1, (now - t0) / ms);
    view.scrollTop = from + (to - from) * ease(t);
    if (t < 1) gliding = requestAnimationFrame(step);
    else land();
  };
  glidingNow = true;
  gliding = requestAnimationFrame(step);
}

// 스크롤 위치에 맞춰 바로가기의 지금 칸을 표시 (표시 한 장이 미끄러져 따라간다).
// 연도를 펼치고 접는 것과 표시 이동은 한 번에 시작해 같은 시간·같은 감속으로 끝난다:
// 펼침·접힘이 끝난 뒤의 자리를 보이지 않는 사본으로 먼저 재서 표시를 그 자리로 곧장 보낸다 (중간 자리에 들르지 않게)
let index = null;
function scrollSpy(root, nav) {
  index = nav;
  const pill = h('span', { class: 'pill', 'aria-hidden': 'true' });
  nav.prepend(pill);
  const view = $('view');
  let last = null;
  const monthBtn = (id) => nav.querySelector(`button[data-target="${id}"]:not([data-year-head])`);
  // 지금 칸이 지난 해면 그 해만 펼치고, 올해·최근 회의·확인할 회의면 지난 해를 모두 접는다
  const openYear = (g) => {
    for (const o of nav.querySelectorAll('.ygroup.open:not(.fixed)')) if (o !== g) o.classList.remove('open');
    g?.classList.add('open');
  };
  // 펼침·접힘이 끝난 뒤 그 버튼의 자리 (바로가기 안 좌표)
  const finalY = (btn) => {
    const ghost = nav.cloneNode(true);
    ghost.classList.add('ghost');
    Object.assign(ghost.style, { position: 'fixed', left: '-9999px', top: '0', width: `${nav.offsetWidth}px`, maxHeight: 'none', overflow: 'visible', visibility: 'hidden' });
    document.body.append(ghost);
    const g = ghost.querySelector(`button[data-target="${btn.dataset.target}"]:not([data-year-head])`);
    const y = g.getBoundingClientRect().top - ghost.getBoundingClientRect().top;
    ghost.remove();
    return y;
  };
  const setActive = (btn) => {
    openYear(btn?.closest('.ygroup'));
    last = btn;
    for (const b of nav.querySelectorAll('button')) b.setAttribute('aria-current', String(b === btn));
    pill.style.opacity = btn ? '1' : '0';
    if (!btn) return;
    const y = finalY(btn);
    pill.style.setProperty('--y', `${y}px`);
    // 바로가기가 길면 지금 칸이 보이게 바로가기 안에서도 따라 내린다
    if (y < nav.scrollTop + 24 || y + 28 > nav.scrollTop + nav.clientHeight - 24) nav.scrollTo({ top: y - nav.clientHeight / 2, behavior: reduce.matches ? 'auto' : 'smooth' });
  };
  for (const b of nav.querySelectorAll('button')) {
    b.onmousedown = (e) => e.preventDefault(); // 누를 때 포커스가 본문을 끌어 움직이지 않게 (키보드 포커스는 그대로)

      const target = b.hasAttribute('data-year-head') ? b.closest('.ygroup').querySelector('.ymonths-in button') : b;
      setActive(target);
      glide(target.dataset.target);

    if (glidingNow) return; // 미끄러져 가는 동안엔 누른 칸을 그대로 (지나치는 달을 따라가지 않는다)
    const secs = [...root.querySelectorAll('[data-spy]')];

    const btn = cur ? monthBtn(cur.id) : null;
    if (btn !== last) setActive(btn);
  };
  view.onscroll = mark;
  requestAnimationFrame(() => {
    pill.style.transition = 'none';
    mark();
    requestAnimationFrame(() => (pill.style.transition = ''));
  });
}

  const out = [];
  if (hand.length) {
    out.push(h('div', { class: 'sec-h' }, h('h2', null, '손볼 회의'), h('span', null, `${hand.length}건 · 확인이 남았거나 실패한 회의`)));
    out.push(h('div', { class: 'triage' }, hand.slice(0, 6).map(handCard)));
    if (hand.length > 6) out.push(h('p', { class: 'count-line', style: 'margin-top:-26px' }, `외 ${hand.length - 6}건은 아래 목록에서 '확인 남음'으로 거를 수 있습니다`));
  }
  out.push(h('section', { class: 'recent' }, h('div', { class: 'sec-h' }, h('h2', null, '최근 2주'), h('span', null, `${recent.length}건`)), recent.map(row)));
  for (const [k, ms] of byMonth(older)) {
    const d = ms[0].at;
    const det = h('div', { class: 'acc' });
    const sum = h('button', { onclick: () => det.toggleAttribute('open') }, icon('i-right'), h('span', { class: 'm' }, `${d.getFullYear() === TODAY.getFullYear() ? '' : `${d.getFullYear()}년 `}${d.getMonth() + 1}월`), h('span', { class: 'c num' }, `${ms.length}건`),
      h('span', { class: 'peek' }, [...new Set(ms.filter((m) => m.title).map((m) => m.title.replace(/ \d+차$/, '')))].slice(0, 5).join(' · ')));
    det.append(sum, h('div', { class: 'body' }, ms.map(row)));
    out.push(det);
  }
  return h('div', null, out);
}

// 비었을 때: 회의가 하나도 없음 / 검색 결과 없음 / 갈래에 해당 없음
function emptyState() {
  const box = (ic, title, text, ...acts) => h('div', { class: 'empty-state' }, h('span', { class: 'empty-mark' }, icon(ic)), h('b', null, title), h('p', null, text), acts.length > 0 && h('div', { class: 'empty-acts' }, acts));
  if (!all.length) return box('i-people', '아직 회의가 없습니다', '회의를 시작할 때 회의 녹음을 누르세요. 끝나면 녹취와 회의록이 여기에 쌓입니다. 다른 앱에서 녹음한 파일은 가져오거나 이 화면에 끌어다 놓으세요.',
    h('button', { class: 'btn rec' }, icon('i-rec'), '회의 녹음 시작'), h('button', { class: 'btn' }, icon('i-folder'), '파일 가져오기'));
  const back = h('button', { class: 'btn', onclick: () => { q = ''; filter = 'all'; draw(); } }, '전체 보기');
  if (q) return box('i-search', `"${q}"가 들어간 회의가 없습니다`, '제목과 요약에서 찾습니다. 다른 말로 찾아 보세요.', h('button', { class: 'btn', onclick: () => { q = ''; draw(); } }, '검색어 지우기'));
  if (filter === 'open') return box('i-check', '확인할 회의가 없습니다', '모든 회의록을 확정했습니다. 새 회의가 끝나면 확인할 부분이 여기에 모입니다.', back);
  if (filter === 'done') return box('i-check', '아직 확정한 회의가 없습니다', '회의록의 확인 필요를 모두 처리하고 확인을 마치면 여기에 모입니다.', back);
  return box('i-check', '실패하거나 짧은 녹음이 없습니다', '', back);
}

function draw(keepFocus = false) {
  const view = $('view');
  const list = visible();
  const active = document.activeElement?.type === 'search';
  const VIEWS = { ledger, mix, triage };
  const askTab = filter.startsWith('ask:') ? askTabs.find((t) => `ask:${t.id}` === filter) : null;
  if (askTab?.status === 'done' && route === 'meetings') askTab.seen = true; // 회의 화면에서 그 탭을 보고 있을 때만 '봄'
  if (filter.startsWith('ask:') && !askTab) filter = 'all';
  const page = route !== 'meetings'
    ? h('div', { class: 'page wide' }, h('div', { class: 'page-head' }, h('h1', null, ROUTE_NAME[route])), h('div', { class: 'empty-state' }, h('span', { class: 'empty-mark' }, icon('i-search')), h('b', null, `${ROUTE_NAME[route]} 화면 자리`), h('p', null, '실험 페이지라 내용은 없습니다. 오른쪽 아래 둥근 버튼은 어느 화면에서든 보이고, 찾던 작업은 화면을 옮겨도 계속됩니다.')), askUI === 'fab' && askOverlay())
    : h('div', { class: 'page wide' }, head(), askTab ? askView(askTab) : list.length ? VIEWS[variant](list) : emptyState(), variant === 'mix' && askOverlay());
  for (const a of document.querySelectorAll('.nav-item[data-route]')) a.dataset.route === route ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  const top = view.scrollTop;
  view.replaceChildren(page);
  if (keepFocus || active) { const i = view.querySelector('input[type=search]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  view.scrollTop = keepFocus ? top : top;
  $('navCount').textContent = String(all.length);
  for (const b of document.querySelectorAll('#variant button')) b.setAttribute('aria-pressed', String(b.dataset.v === variant));
  for (const b of document.querySelectorAll('#askui button')) b.setAttribute('aria-pressed', String(b.dataset.a === askUI));
  document.getElementById('askui').style.display = variant === 'mix' ? '' : 'none';
  for (const b of document.querySelectorAll('#size button')) b.setAttribute('aria-pressed', String(Number(b.dataset.n) === size && Boolean(b.dataset.clean) === clean && Boolean(b.dataset.sparse) === sparse));
}
for (const b of document.querySelectorAll('#variant button')) b.onclick = () => { variant = b.dataset.v; $('view').scrollTop = 0; draw(); };
for (const b of document.querySelectorAll('#size button')) b.onclick = () => { size = Number(b.dataset.n); clean = Boolean(b.dataset.clean); sparse = Boolean(b.dataset.sparse); all = makeMeetings(size, { clean, sparse }); filter = 'all'; q = ''; $('view').scrollTop = 0; draw(); };
for (const b of document.querySelectorAll('#askui button')) b.onclick = () => { askUI = b.dataset.a; askOpen = false; draw(); };
for (const a of document.querySelectorAll('.nav-item[data-route]')) a.onclick = (e) => { e.preventDefault(); route = a.dataset.route; $('view').scrollTop = 0; draw(); };
document.addEventListener('keydown', (e) => { if (e.metaKey && e.key === 'j' && askUI === 'palette') { e.preventDefault(); askOpen = true; draw(); } });
// 바깥을 누르면 검색창 아래 패널 닫기
document.addEventListener('mousedown', (e) => { if (askUI === 'bar' && askOpen && !e.target.closest('.askbar')) { askOpen = false; draw(true); } });
const params = new URLSearchParams(location.search);
variant = params.get('v') ?? variant;
size = Number(params.get('n') ?? size);
clean = params.get('clean') === '1';
sparse = params.get('sparse') === '1';
askUI = params.get('ask') ?? askUI;
all = makeMeetings(size, { clean, sparse });
draw();
// 미리 보기용: 끝난 질문 하나와 진행 중인 질문 하나
if (params.get('seed') === '1') { startAsk('성능 시험 관련 회의'); askTabs[0].t0 -= 30000; setTimeout(() => { askScope = { count: 50, from: '', to: '' }; startAsk('작년 2월에 한 회의'); askScope = defaultScope(); }, 5200); }
</script>
</body>
</html>
