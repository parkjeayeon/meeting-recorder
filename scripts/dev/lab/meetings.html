<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>회의 목록 실험</title>
<!-- 회의 목록 대안 세 가지를 가짜 회의로 비교하는 개발용 페이지 (앱에 들어가지 않는다). npm run lab:meetings -->
<link rel="stylesheet" href="../../../src/renderer/style.css" />
<style>
  /* ── 실험 막대 (앱에 없는 부분) ── */
  .lab-bar { display: flex; align-items: center; gap: 10px; flex: 1; -webkit-app-region: no-drag; }
  .seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--shell-on); }
  .seg button { height: 26px; padding: 0 12px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
  .seg button[aria-pressed='true'] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(16, 20, 26, 0.08); }
  .lab-note { font-size: 12px; color: var(--ink-3); }

  .page-head .search { width: 280px; }
  .count-line { margin: -14px 0 20px; font-size: 12.5px; color: var(--ink-3); }

  /* ── A. 장부: 월로 묶은 촘촘한 줄, 오른쪽 월 색인 ── */
  .ledger-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 28px; }
  .ledger-month { position: relative; }
  .ledger-mhead {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 10px;
    padding: 14px 0 8px; margin-bottom: 2px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .ledger-mhead h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.015em; }
  .ledger-mhead span { font-size: 12px; color: var(--ink-3); }
  .lrow {
    display: grid; grid-template-columns: 58px 46px minmax(0, 1fr) 84px 62px 44px; align-items: center; gap: 12px;
    min-height: 44px; padding: 0 10px; margin: 0 -10px; border-radius: 9px; text-decoration: none; color: inherit;
  }
  .lrow:hover { background: var(--panel-2); }
  .lrow.daystart { border-top: 1px solid var(--line); border-radius: 0 0 9px 9px; }
  .ledger-month .lrow.daystart:first-of-type { border-top: 0; }
  .lday { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; font-size: 13px; font-weight: 650; color: var(--ink); }
  .lday small { font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
  .lday.weekend small { color: var(--accent); }
  .ltime { font-size: 12px; color: var(--ink-3); }
  .ltitle { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .ltitle b { font-weight: 620; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
  .ltitle span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ltitle.muted b { color: var(--ink-3); font-weight: 550; }
  .ldur { font-size: 12px; color: var(--ink-3); text-align: right; }
  .st { justify-self: start; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .st.open { background: var(--accent-wash); color: var(--accent); }
  .st.done { color: var(--ink-3); padding: 0; }
  .st.done svg { width: 13px; height: 13px; color: var(--ok); }
  .st.fail { background: var(--accent); color: var(--accent-ink); }
  .st.busy { background: var(--panel-3); color: var(--ink-2); }
  .st.busy::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .st.quiet { color: var(--ink-3); padding: 0; font-weight: 500; }
  .index { position: sticky; top: 8px; align-self: start; display: flex; flex-direction: column; gap: 1px; padding-top: 14px; }
  .index h3 { margin: 0 0 6px 8px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
  .index button { display: flex; justify-content: space-between; align-items: center; height: 28px; padding: 0 8px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font-size: 12.5px; text-align: left; }
  .index button:hover { background: var(--panel-2); color: var(--ink); }
  .index button[aria-current='true'] { background: var(--panel-3); color: var(--ink); font-weight: 650; }
  .index button .num { font-size: 11px; color: var(--ink-3); }
  .index .year { margin: 10px 0 4px 8px; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }

  /* ── B. 섞기: 손볼 회의 + 최근 2주 (C) 위에, 그 아래는 장부 (A). 오른쪽 바로가기가 전체를 잇는다 ── */
  .mix-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 28px; }
  .mix-sec { scroll-margin-top: 8px; }
  .mix-sec + .mix-sec { margin-top: 36px; }
  .archive-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; padding-top: 4px; }
  .archive-h h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.015em; }
  .archive-h span { font-size: 12px; color: var(--ink-3); }
  .index .sep { height: 1px; margin: 8px 8px; background: var(--line); }
  .index button.hot .num { color: var(--accent); font-weight: 600; }

  /* ── C. 손볼 것 먼저: 할 일 칸 + 최근 + 접힌 달 ── */
  .triage { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-bottom: 36px; }
  .tcard { display: flex; flex-direction: column; gap: 8px; padding: 14px 14px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); text-decoration: none; color: inherit; }
  .tcard:hover { border-color: var(--line-2); }
  .tcard .top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
  .tcard .top .st { margin-left: auto; }
  .tcard b { font-size: 14.5px; font-weight: 650; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tcard .act { display: flex; gap: 6px; margin-top: 2px; }
  .sec-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; }
  .sec-h h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.015em; }
  .sec-h span { font-size: 12px; color: var(--ink-3); }
  .recent { margin-bottom: 36px; }
  .crow { display: grid; grid-template-columns: 112px minmax(0, 1fr) 84px 62px; gap: 14px; align-items: center; min-height: 46px; padding: 0 10px; margin: 0 -10px; border-radius: 9px; text-decoration: none; color: inherit; }
  .crow:hover { background: var(--panel-2); }
  .crow .when { font-size: 12.5px; color: var(--ink-3); }
  .crow .when b { color: var(--ink); font-weight: 650; margin-right: 6px; }
  .acc { border-top: 1px solid var(--line); }
  .acc:last-child { border-bottom: 1px solid var(--line); }
  .acc > button { display: grid; grid-template-columns: 16px 110px 64px minmax(0, 1fr); align-items: center; gap: 10px; width: 100%; min-height: 50px; padding: 0 4px; border: 0; background: none; text-align: left; }
  .acc > button:hover { background: var(--panel-2); }
  .acc > button svg { width: 14px; height: 14px; color: var(--ink-3); transition: transform .18s ease-out; }
  .acc[open] > button svg { transform: rotate(90deg); }
  .acc .m { font-size: 14.5px; font-weight: 680; }
  .acc .c { font-size: 12px; color: var(--ink-3); }
  .acc .peek { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acc .body { padding: 2px 4px 12px 30px; }
  .acc:not([open]) .body { display: none; }

  .lab-empty { padding: 60px 0; text-align: center; color: var(--ink-3); }
</style>
</head>

<script>
// ── 지어낸 회의 (같은 씨앗이면 같은 결과) ──
const TOPICS = [
  ['주간 회의', '이번 주 진행 상황과 막힌 점을 공유하고 다음 주 우선순위를 정했습니다.'],
  ['배포 점검', '화요일 배포 범위와 롤백 기준을 정하고 QA 담당을 나눴습니다.'],
  ['디자인 리뷰', '회의 목록 화면 시안을 보고 밀도와 탐색 방식을 논의했습니다.'],
  ['채용 면접', '백엔드 지원자와 시스템 설계 질문을 중심으로 이야기했습니다.'],
  ['고객사 미팅', '계약 범위와 일정, 통신 안정성 요구 사항을 확인했습니다.'],
  ['1:1', '최근 업무 부담과 다음 분기 목표를 이야기했습니다.'],
  ['분기 계획', '다음 분기 핵심 과제 세 가지와 담당을 정했습니다.'],
  ['장애 회고', '지난주 접속 장애의 원인과 재발 방지 조치를 정리했습니다.'],
  ['온보딩', '새 팀원에게 개발 환경과 배포 절차를 설명했습니다.'],
  ['예산 검토', '클라우드 비용 증가 원인과 줄일 수 있는 항목을 살폈습니다.'],
  ['인수인계', '결제 모듈 담당이 바뀌어 운영 절차와 주의할 점을 넘겼습니다.'],
  ['기획 회의', '받아쓰기 다듬기 기능의 범위와 출시 순서를 정했습니다.'],
];
function rng(seed) { return () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648); }
function makeMeetings(n) {
  const r = rng(7);
  const out = [];
  const now = new Date(2026, 10, 6, 15, 0);
  for (let d = 0; out.length < n; d++) {
    const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - d);
    const wk = day.getDay();
    const weekend = wk === 0 || wk === 6;
    const k = weekend ? (r() < 0.12 ? 1 : 0) : [0, 1, 1, 2, 2, 3, 4][Math.floor(r() * 7)];
    const hours = [9, 10, 11, 13, 14, 15, 16, 17].sort(() => r() - 0.5).slice(0, k).sort((a, b) => a - b);
    for (const hr of hours) {
      if (out.length >= n) break;
      const at = new Date(day.getFullYear(), day.getMonth(), day.getDate(), hr, Math.floor(r() * 4) * 15);
      if (at > now) continue;
      const t = TOPICS[Math.floor(r() * TOPICS.length)];
      const x = r();
      const age = d;
      const status = d === 0 && out.length === 0 ? 'busy' : x < 0.04 ? 'fail' : x < 0.07 ? 'short' : 'done';
      const open = status === 'done' ? (age < 10 ? [0, 1, 2, 3][Math.floor(r() * 4)] : r() < 0.15 ? 1 + Math.floor(r() * 2) : 0) : 0;
      out.push({
        id: `m${out.length}`, at, dur: status === 'short' ? 6 : 600 + Math.floor(r() * 5400), title: status === 'done' || status === 'busy' ? `${t[0]}${r() < 0.5 ? '' : ` ${1 + Math.floor(r() * 9)}차`}` : null,
        summary: status === 'done' ? t[1] : null, status, open, finalized: status === 'done' && open === 0 && r() < 0.8, speakers: 1 + Math.floor(r() * 5),
        todos: status === 'done' ? Math.floor(r() * 4) : 0,
      });
    }
  }
  return out;
}

// ── 공통 ──
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el[k] = v; else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
const icon = (id) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', `#${id}`); s.append(u); return s; };
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const TODAY = new Date(2026, 10, 6);
const p2 = (n) => String(n).padStart(2, '0');
const hm = (d) => `${p2(d.getHours())}:${p2(d.getMinutes())}`;
const clock = (s) => (s >= 3600 ? `${Math.floor(s / 3600)}:${p2(Math.floor((s % 3600) / 60))}:${p2(s % 60)}` : `${p2(Math.floor(s / 60))}:${p2(s % 60)}`);
const sameDay = (a, b) => a.toDateString() === b.toDateString();
const monthKey = (d) => `${d.getFullYear()}-${p2(d.getMonth() + 1)}`;
const dayName = (d) => { const diff = Math.round((new Date(TODAY) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5); return diff === 0 ? '오늘' : diff === 1 ? '어제' : `${d.getMonth() + 1}월 ${d.getDate()}일`; };
const titleOf = (m) => m.title ?? (m.status === 'fail' ? '회의록을 만들지 못했습니다' : m.status === 'short' ? '짧은 녹음 (10초 미만)' : '회의록 만드는 중');
const speakers = (n) => h('span', { class: 'speakers' }, Array.from({ length: Math.min(n, 6) }, (_, i) => h('i', { style: `background:var(--s${i + 1})` })));
function stateOf(m) {
  if (m.status === 'busy') return h('span', { class: 'st busy' }, '녹취 중 62%');
  if (m.status === 'fail') return h('span', { class: 'st fail' }, '실패');
  if (m.status === 'short') return h('span', { class: 'st quiet' }, '짧은 녹음');
  if (m.open) return h('span', { class: 'st open' }, `확인 ${m.open}`);
  if (m.finalized) return h('span', { class: 'st done' }, icon('i-check'), '확정');
  return h('span', { class: 'st quiet' }, '초안');
}
const needsHand = (m) => m.status === 'fail' || m.status === 'busy' || m.open > 0;

let all = [];
let variant = 'ledger';
let size = 160;
let q = '';
let filter = 'all';
const FILTERS = [['all', '전체', () => true], ['open', '확인 남음', (m) => m.open > 0], ['fail', '실패·짧은 녹음', (m) => m.status === 'fail' || m.status === 'short']];
const visible = () => all.filter(FILTERS.find((f) => f[0] === filter)[2]).filter((m) => !q || `${m.title ?? ''} ${m.summary ?? ''}`.includes(q));

function head() {
  const input = h('input', { type: 'search', placeholder: '제목, 요약 검색', value: q });
  input.oninput = () => { q = input.value.trim(); draw(true); };
  return [
    h('div', { class: 'page-head' }, h('h1', null, '회의', h('span', { class: 'num' }, String(all.length))),
      h('button', { class: 'btn' }, icon('i-folder'), '파일 가져오기'),
      h('label', { class: 'search' }, icon('i-search'), input)),
    h('div', { class: 'chips' }, FILTERS.map(([id, label, fn]) => h('button', { class: 'chip', 'aria-pressed': String(filter === id), onclick: () => { filter = id; draw(); } }, label, h('span', { class: 'num' }, String(all.filter(fn).length))))),
  ];
}

function byMonth(list) {
  const map = new Map();
  for (const m of list) { const k = monthKey(m.at); if (!map.has(k)) map.set(k, []); map.get(k).push(m); }
  return [...map.entries()];
}
const hours = (list) => { const s = list.reduce((n, m) => n + m.dur, 0); return `${Math.floor(s / 3600)}시간 ${Math.floor((s % 3600) / 60)}분`; };

// ── A. 장부 ──
function ledger(list) {
  const index = h('nav', { class: 'index', 'aria-label': '달' }, h('h3', null, '바로 가기'));
  const body = h('div', null, monthSections(list, index));
  scrollSpy(body, index);
  return h('div', { class: 'ledger-wrap' }, body, index);
}

// ── B. 섞기: C의 위쪽 + A의 장부 ──
// 장부의 달 묶음을 만든다 (A·B가 같이 쓴다). index에 달 버튼을 더한다
function monthSections(list, index) {
  const out = [];
  let year = null;
  for (const [k, ms] of byMonth(list)) {
    const d = ms[0].at;
    if (d.getFullYear() !== year) { year = d.getFullYear(); index.append(h('div', { class: 'year' }, `${year}년`)); }
    const sec = h('section', { class: 'ledger-month', id: `mon-${k}`, 'data-spy': '' }, h('div', { class: 'ledger-mhead' }, h('h2', null, `${d.getFullYear()}년 ${d.getMonth() + 1}월`), h('span', null, `${ms.length}건 · ${hours(ms)}`)));
    sec.append(...ledgerRows(ms));
    out.push(sec);
    index.append(h('button', { 'data-target': `mon-${k}`, onclick: () => $(`mon-${k}`).scrollIntoView({ block: 'start' }) }, `${d.getMonth() + 1}월`, h('span', { class: 'num' }, String(ms.length))));
  }
  return out;
}

// 장부 줄: 날짜는 그날 첫 줄에만. recent면 '오늘·어제·11월 4일'로 (달 제목이 없는 구획)
function ledgerRows(ms, { recent = false } = {}) {
  let prev = null;
  return ms.map((m) => {
    const first = !prev || !sameDay(prev.at, m.at);
    prev = m;
    const wk = m.at.getDay();
    const diff = Math.round((TODAY - new Date(m.at.getFullYear(), m.at.getMonth(), m.at.getDate())) / 864e5);
    const label = recent && diff <= 1 ? [diff ? '어제' : '오늘', h('small', null, WD[wk])] : [String(recent ? `${m.at.getMonth() + 1}/${m.at.getDate()}` : m.at.getDate()), h('small', null, !recent && diff === 0 ? '오늘' : WD[wk])];
    return h('a', { class: `lrow${first ? ' daystart' : ''}`, href: '#' },
      first ? h('span', { class: `lday${wk === 0 || wk === 6 ? ' weekend' : ''}` }, label) : h('span'),
      h('time', { class: 'ltime' }, hm(m.at)),
      h('span', { class: `ltitle${m.title ? '' : ' muted'}` }, h('b', null, titleOf(m)), m.summary && h('span', null, m.summary)),
      stateOf(m),
      h('span', { class: 'ldur num' }, clock(m.dur)),
      speakers(m.speakers));
  });
}

// 스크롤 위치에 맞춰 바로가기의 지금 칸을 표시
function scrollSpy(root, index) {
  requestAnimationFrame(() => {
    const view = $('view');
    const mark = () => {
      const secs = [...root.querySelectorAll('[data-spy]')];
      const top = view.getBoundingClientRect().top + 60;
      const cur = secs.filter((s) => s.getBoundingClientRect().top <= top).pop() ?? secs[0];
      for (const b of index.querySelectorAll('button')) b.setAttribute('aria-current', String(Boolean(cur) && b.dataset.target === cur.id));
    };
    view.onscroll = mark;
    mark();
  });
}

function mix(list) {
  const hand = list.filter(needsHand);
  const cut = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - 13);
  const recent = list.filter((m) => m.at >= cut);
  const older = list.filter((m) => m.at < cut);
  const index = h('nav', { class: 'index', 'aria-label': '바로 가기' }, h('h3', null, '바로 가기'));
  const jump = (id, label, n, hot = false) => index.append(h('button', { class: hot ? 'hot' : null, 'data-target': id, onclick: () => $(id).scrollIntoView({ block: 'start' }) }, label, h('span', { class: 'num' }, String(n))));
  const body = h('div');
  if (hand.length) {
    jump('sec-hand', '손볼 회의', hand.length, true);
    body.append(h('section', { class: 'mix-sec', id: 'sec-hand', 'data-spy': '' },
      h('div', { class: 'sec-h' }, h('h2', null, '손볼 회의'), h('span', null, `${hand.length}건 · 확인이 남았거나 실패한 회의`)),
      h('div', { class: 'triage', style: 'margin-bottom:0' }, hand.slice(0, 6).map(handCard)),
      hand.length > 6 && h('p', { class: 'count-line', style: 'margin:10px 0 0' }, `외 ${hand.length - 6}건은 위 '확인 남음'으로 거를 수 있습니다`)));
  }
  if (recent.length) {
    jump('sec-recent', '최근 2주', recent.length);
    body.append(h('section', { class: 'mix-sec', id: 'sec-recent', 'data-spy': '' }, h('div', { class: 'sec-h', style: 'margin-bottom:2px;padding-bottom:8px;border-bottom:1px solid var(--line)' }, h('h2', null, '최근 2주'), h('span', null, `${recent.length}건 · ${hours(recent)}`)), h('div', { class: 'ledger-month' }, ledgerRows(recent, { recent: true }))));
  }
  if (older.length) {
    index.append(h('div', { class: 'sep' }));
    body.append(h('div', { class: 'mix-sec' }, h('div', { class: 'archive-h' }, h('h2', null, '이전 회의'), h('span', null, `${older.length}건`)), monthSections(older, index)));
  }
  scrollSpy(body, index);
  return h('div', { class: 'mix-wrap' }, body, index);
}

// C·B가 같이 쓰는 줄과 카드
const recentRow = (m) => h('a', { class: 'crow', href: '#' },
  h('span', { class: 'when' }, h('b', null, dayName(m.at)), h('time', { class: 'num' }, hm(m.at))),
  h('span', { class: `ltitle${m.title ? '' : ' muted'}` }, h('b', null, titleOf(m)), m.summary && h('span', null, m.summary)),
  stateOf(m), h('span', { class: 'ldur num' }, clock(m.dur)));
const handCard = (m) => h('a', { class: 'tcard', href: '#' },
  h('div', { class: 'top' }, `${dayName(m.at)} ${hm(m.at)}`, stateOf(m)),
  h('b', null, titleOf(m)),
  h('div', { class: 'act' }, m.status === 'fail' ? h('button', { class: 'btn small' }, icon('i-redo'), '다시 만들기') : m.status === 'busy' ? h('span', { class: 'lab-note' }, '약 4분 남음') : h('button', { class: 'btn small' }, '확인하기')));

// ── C. 손볼 것 먼저 ──
function triage(list) {
  const hand = list.filter(needsHand);
  const cut = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - 13);
  const recent = list.filter((m) => m.at >= cut);
  const older = list.filter((m) => m.at < cut);
  const row = recentRow;
  const out = [];
  if (hand.length) {
    out.push(h('div', { class: 'sec-h' }, h('h2', null, '손볼 회의'), h('span', null, `${hand.length}건 · 확인이 남았거나 실패한 회의`)));
    out.push(h('div', { class: 'triage' }, hand.slice(0, 6).map(handCard)));
    if (hand.length > 6) out.push(h('p', { class: 'count-line', style: 'margin-top:-26px' }, `외 ${hand.length - 6}건은 아래 목록에서 '확인 남음'으로 거를 수 있습니다`));
  }
  out.push(h('section', { class: 'recent' }, h('div', { class: 'sec-h' }, h('h2', null, '최근 2주'), h('span', null, `${recent.length}건`)), recent.map(row)));
  for (const [k, ms] of byMonth(older)) {
    const d = ms[0].at;
    const det = h('div', { class: 'acc' });
    const sum = h('button', { onclick: () => det.toggleAttribute('open') }, icon('i-right'), h('span', { class: 'm' }, `${d.getFullYear() === TODAY.getFullYear() ? '' : `${d.getFullYear()}년 `}${d.getMonth() + 1}월`), h('span', { class: 'c num' }, `${ms.length}건`),
      h('span', { class: 'peek' }, [...new Set(ms.filter((m) => m.title).map((m) => m.title.replace(/ \d+차$/, '')))].slice(0, 5).join(' · ')));
    det.append(sum, h('div', { class: 'body' }, ms.map(row)));
    out.push(det);
  }
  return h('div', null, out);
}

function draw(keepFocus = false) {
  const view = $('view');
  const list = visible();
  const active = document.activeElement?.type === 'search';
  const VIEWS = { ledger, mix, triage };
  const page = h('div', { class: 'page wide' }, head(), list.length ? VIEWS[variant](list) : h('div', { class: 'lab-empty' }, '맞는 회의가 없습니다'));
  const top = view.scrollTop;
  view.replaceChildren(page);
  if (keepFocus || active) { const i = view.querySelector('input[type=search]'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  view.scrollTop = keepFocus ? top : top;
  $('navCount').textContent = String(all.length);
  for (const b of document.querySelectorAll('#variant button')) b.setAttribute('aria-pressed', String(b.dataset.v === variant));
  for (const b of document.querySelectorAll('#size button')) b.setAttribute('aria-pressed', String(Number(b.dataset.n) === size));
}
for (const b of document.querySelectorAll('#variant button')) b.onclick = () => { variant = b.dataset.v; $('view').scrollTop = 0; draw(); };
for (const b of document.querySelectorAll('#size button')) b.onclick = () => { size = Number(b.dataset.n); all = makeMeetings(size); $('view').scrollTop = 0; draw(); };
const params = new URLSearchParams(location.search);
variant = params.get('v') ?? variant;
size = Number(params.get('n') ?? size);
all = makeMeetings(size);
draw();
</script>
</body>
</html>
