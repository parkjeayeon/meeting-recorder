<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src rec:" />
  <title>Meeting Recorder</title>
  <!-- 화면은 Vite로 묶은 lib/renderer/를 불러온다 (npm run build:renderer). 문서 주소는 그대로라 localStorage·워크릿 경로가 같다 -->
  <link rel="stylesheet" href="../../lib/renderer/main.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 20 20"><path d="M3.5 9 10 3.5 16.5 9v7a1 1 0 0 1-1 1h-3.5v-4.5h-4V17H4.5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-mic" viewBox="0 0 20 20"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></symbol>
    <symbol id="i-people" viewBox="0 0 20 20"><circle cx="7.5" cy="7" r="2.75"/><path d="M2.5 16c.6-2.6 2.6-4 5-4s4.4 1.4 5 4"/><path d="M13 4.6a2.6 2.6 0 0 1 0 4.9M14.6 12.3c1.5.5 2.5 1.8 2.9 3.7"/></symbol>
    <symbol id="i-book" viewBox="0 0 20 20"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H16v11.5H5.5A1.5 1.5 0 0 0 4 16zM4 16a1.5 1.5 0 0 0 1.5 1.5H16v-3"/><path d="M7.5 6.5h5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 20 20"><path d="M3.5 16.5h13M6 13.5v-4M10 13.5v-8M14 13.5V8"/></symbol>
    <symbol id="i-gear" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></symbol>
    <symbol id="i-search" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></symbol>
    <symbol id="i-rec" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><circle cx="10" cy="10" r="3" class="fill"/></symbol>
    <symbol id="i-stop" viewBox="0 0 20 20"><rect x="5.5" y="5.5" width="9" height="9" rx="2" class="fill"/></symbol>
    <symbol id="i-play" viewBox="0 0 20 20"><path d="M6.5 4.5v11l9-5.5z" class="fill"/></symbol>
    <symbol id="i-pause" viewBox="0 0 20 20"><rect x="5.5" y="4.5" width="3" height="11" rx="1" class="fill"/><rect x="11.5" y="4.5" width="3" height="11" rx="1" class="fill"/></symbol>
    <symbol id="i-back10" viewBox="0 0 20 20"><path d="M4.5 10a5.5 5.5 0 1 0 1.8-4.1"/><path d="M6.5 2.5v3.6H2.9"/></symbol>
    <symbol id="i-fwd10" viewBox="0 0 20 20"><path d="M15.5 10a5.5 5.5 0 1 1-1.8-4.1"/><path d="M13.5 2.5v3.6h3.6"/></symbol>
    <symbol id="i-left" viewBox="0 0 20 20"><path d="M12 4.5 6.5 10l5.5 5.5"/></symbol>
    <symbol id="i-right" viewBox="0 0 20 20"><path d="m8 4.5 5.5 5.5L8 15.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 20 20"><path d="M10 3.5v9M6 9l4 4 4-4M4 15.5h12"/></symbol>
    <symbol id="i-copy" viewBox="0 0 20 20"><rect x="7" y="7" width="9.5" height="9.5" rx="2"/><path d="M13 7V4.5A1 1 0 0 0 12 3.5H4.5a1 1 0 0 0-1 1V12a1 1 0 0 0 1 1H7"/></symbol>
    <symbol id="i-paste" viewBox="0 0 20 20"><path d="M7 3.5h6v2.5H7zM13 4.5h1.5a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1H7"/><path d="M8 12l2 2 2-2M10 8.5V14"/></symbol>
    <symbol id="i-folder" viewBox="0 0 20 20"><path d="M2.5 5.5a1 1 0 0 1 1-1h4l1.5 2h7.5a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 20 20"><path d="M3.5 5.5h13M8 5.5V3.5h4v2M5 5.5l.8 10.6a1 1 0 0 0 1 .9h6.4a1 1 0 0 0 1-.9L15 5.5"/></symbol>
    <symbol id="i-redo" viewBox="0 0 20 20"><path d="M15.5 9.5a5.5 5.5 0 1 1-1.6-3.9L16 7.5"/><path d="M16 3.5v4h-4"/></symbol>
    <symbol id="i-more" viewBox="0 0 20 20"><circle cx="5" cy="10" r="1.2" class="fill"/><circle cx="10" cy="10" r="1.2" class="fill"/><circle cx="15" cy="10" r="1.2" class="fill"/></symbol>
    <symbol id="i-x" viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></symbol>
    <symbol id="i-check" viewBox="0 0 20 20"><path d="m4.5 10.5 3.5 3.5 7.5-8"/></symbol>
    <symbol id="i-key" viewBox="0 0 20 20"><circle cx="7" cy="12.5" r="3.5"/><path d="M9.5 10l7-7M14 5.5l2 2M12 7.5l1.5 1.5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 20 20"><path d="M10 2.5 16 5v4.5c0 3.8-2.5 6.6-6 8-3.5-1.4-6-4.2-6-8V5z"/></symbol>
    <symbol id="i-wand" viewBox="0 0 20 20"><path d="m3.5 16.5 9-9M11 6l3 3M14.5 2.5v2M17.5 5.5h-2M16.6 3.4l-1.4 1.4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6v4.5M10 13.5v.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></symbol>
    <symbol id="i-flag" viewBox="0 0 20 20"><path d="M5 17V3.5M5 4h9.5l-2 3.25 2 3.25H5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 20 20"><path d="M13.5 3.5l3 3L7 16H4v-3z"/><path d="M11.5 5.5l3 3"/></symbol>
    <symbol id="i-chat" viewBox="0 0 20 20"><path d="M4 4.5h12a1 1 0 0 1 1 1V13a1 1 0 0 1-1 1H9l-4 3v-3H4a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3c2 2.2 2.9 4.5 2.9 7S12 14.8 10 17c-2-2.2-2.9-4.5-2.9-7S8 5.2 10 3z"/></symbol>
    <symbol id="i-send" viewBox="0 0 20 20"><path d="M3.5 10 16.5 4 12 16.5l-2.5-5z"/><path d="m9.5 11.5 7-7.5"/></symbol>
  </svg>

  <div class="shell" hidden>
    <aside class="side">
      <div class="side-drag"></div>
      <div class="brand"><span class="brand-mark"><svg><use href="#i-mic"/></svg></span>Meeting Recorder</div>
      <button class="search-btn" id="openPalette"><svg><use href="#i-search"/></svg><span>검색</span><kbd>⌘K</kbd></button>
      <nav class="nav" aria-label="화면">
        <a class="nav-item" href="#home" data-route="home"><svg><use href="#i-home"/></svg><span>홈</span></a>
        <a class="nav-item" href="#dictations" data-route="dictations"><svg><use href="#i-mic"/></svg><span>받아쓰기</span><span class="count" id="countDict"></span></a>
        <a class="nav-item" href="#meetings" data-route="meetings"><svg><use href="#i-people"/></svg><span>회의</span><span class="count" id="countMeet"></span></a>
        <a class="nav-item" href="#dictionary" data-route="dictionary"><svg><use href="#i-book"/></svg><span>사전</span><span class="count" id="countWords"></span></a>
        <a class="nav-item" href="#stats" data-route="stats"><svg><use href="#i-chart"/></svg><span>통계</span></a>
      </nav>
      <div class="side-foot">
        <!-- 받아쓰기 언어: 늘 보이고 한 번에 바꾼다 (회의 녹취 언어는 설정 › 회의에서 따로) -->
        <label class="side-lang" title="fn 받아쓰기 언어 · 회의 녹취 언어는 설정 › 회의에서 따로">
          <svg><use href="#i-globe"/></svg>
          <span>받아쓰기</span>
          <select id="sideLanguage" aria-label="받아쓰기 언어">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="auto">자동 (한·영·일)</option>
          </select>
        </label>
        <button class="engines" id="enginesBtn" title="엔진 상태 · 눌러서 설정">
          <span class="engine" id="engAsr"><i></i><span>음성 인식</span><em></em></span>
          <span class="engine" id="engCleanup"><i></i><span>다듬기</span><em></em></span>
          <span class="engine" id="engDiarize"><i></i><span>화자 구분</span><em></em></span>
        </button>
        <button class="nav-item" id="openSettings"><svg><use href="#i-gear"/></svg><span>설정</span><span class="dot" id="settingsDot" hidden></span><kbd>⌘,</kbd></button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="hist">
          <button class="icon-btn" id="navBack" aria-label="뒤로" title="뒤로 (⌘[)" disabled><svg><use href="#i-left"/></svg></button>
          <button class="icon-btn" id="navFwd" aria-label="앞으로" title="앞으로 (⌘])" disabled><svg><use href="#i-right"/></svg></button>
        </div>
        <div class="crumbs" id="crumbs"></div>
        <div class="live" id="live" data-state="idle" aria-live="polite" hidden></div>
        <label class="live-speakers" id="liveSpeakers" hidden title="화자 구분에 쓰는 참석 인원. 녹음 중에도 바꿀 수 있습니다."></label>
        <div class="top-acts"></div>
      </header>
      <main class="panel">
        <div class="view" id="view" tabindex="-1"></div>
      </main>
    </div>
  </div>

  <div class="onboard" id="onboard" hidden></div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog class="palette" id="palette" aria-label="빠른 검색">
    <div class="palette-input">
      <svg><use href="#i-search"/></svg>
      <input id="paletteInput" type="text" placeholder="회의 제목, 받아쓴 말, 화면, 동작 검색" autocomplete="off" spellcheck="false" />
      <kbd>esc</kbd>
    </div>
    <div class="palette-list" id="paletteList" role="listbox"></div>
  </dialog>

  <dialog class="sheet" id="meetStart" aria-labelledby="meetStartTitle"></dialog>

  <dialog class="sheet" id="importSheet" aria-labelledby="importTitle"></dialog>

  <dialog class="modal confirm" id="confirm">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="modal-acts">
      <button class="btn" id="confirmNo">취소</button>
      <button class="btn danger" id="confirmYes"></button>
    </div>
  </dialog>

  <dialog class="settings" id="settings" aria-labelledby="settingsTitle"></dialog>

  <script type="module" src="../../lib/renderer/main.js"></script>
</body>
</html>
