<header class="topbar">
        <div class="hist">
          <button class="icon-btn" id="navBack" aria-label="뒤로" title="뒤로 (⌘[)" disabled><svg><use href="#i-left"/></svg></button>
          <button class="icon-btn" id="navFwd" aria-label="앞으로" title="앞으로 (⌘])" disabled><svg><use href="#i-right"/></svg></button>
        </div>
        <div class="crumbs" id="crumbs"></div>
        <div class="live" id="live" data-state="idle" aria-live="polite" hidden>
          <span class="live-dot"></span>
          <span class="live-text" id="liveText"></span>
          <ol class="route" id="route" hidden>
            <li data-stage="listen">듣기</li><li data-stage="transcribe">인식</li><li data-stage="cleanup">다듬기</li><li data-stage="paste">입력</li>
          </ol>
          <canvas class="tape" id="tape" width="96" height="18" hidden></canvas>
          <span class="live-time" id="liveTime"></span>
        </div>
        <label class="live-speakers" id="liveSpeakers" hidden title="화자 구분에 쓰는 참석 인원. 녹음 중에도 바꿀 수 있습니다.">
          <svg><use href="#i-people"/></svg>
          <select id="liveSpeakersSel" aria-label="참석 인원"></select>
        </label>
        <div class="top-acts">
          <button class="btn ghost" id="cancelBtn" hidden title="저장하지 않고 버립니다"><svg><use href="#i-x"/></svg><span>취소</span></button>
          <button class="btn ghost" id="pauseBtn" hidden><svg><use href="#i-pause"/></svg><span>일시정지</span></button>
          <button class="btn ghost" id="memoBtn" title="fn을 꾹 눌러도 됩니다"><svg><use href="#i-mic"/></svg><span>받아쓰기</span></button>
          <button class="btn rec" id="meetingBtn"><svg><use href="#i-rec"/></svg><span>회의 녹음</span></button>
        </div>
      </header>

<dialog class="sheet" id="meetStart" aria-labelledby="meetStartTitle">
    <header class="sheet-head">
      <span class="sheet-mark"><svg><use href="#i-rec"/></svg></span>
      <div>
        <h3 id="meetStartTitle">회의 녹음 시작</h3>
        <p>시작한 뒤에도 일시정지하거나 취소할 수 있습니다.</p>
      </div>
      <button class="icon-btn" id="startClose" aria-label="닫기"><svg><use href="#i-x"/></svg></button>
    </header>
    <section class="sheet-sec">
      <div class="sheet-label"><b>참석 인원</b><span>알려 주면 누가 말했는지 더 정확하게 나눕니다</span></div>
      <div class="segbar" id="startSpeakers" role="radiogroup" aria-label="참석 인원"></div>
    </section>
    <section class="sheet-sec">
      <div class="sheet-label"><b>회의 방식</b></div>
      <div class="kinds" id="startKind" role="radiogroup" aria-label="회의 방식">
        <button type="button" role="radio" data-kind="offline"><svg><use href="#i-people"/></svg><b>대면 회의</b><span>이 Mac 마이크로만 녹음</span></button>
        <button type="button" role="radio" data-kind="online"><svg><use href="#i-mic"/></svg><b>화상 회의</b><span>상대방 소리(시스템 오디오)도 함께</span></button>
      </div>
    </section>
    <footer class="sheet-foot">
      <label class="inline-switch"><span class="switch"><input type="checkbox" id="startMinutes" /><i></i></span>끝나면 회의록 만들기</label>
      <button class="btn" id="startNo">닫기</button>
      <button class="btn rec" id="startYes"><svg><use href="#i-rec"/></svg>녹음 시작</button>
    </footer>
  </dialog>
